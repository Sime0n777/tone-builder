[package]
name = "tone-builder-desktop"
version = "0.1.0"
edition = "2021"
description = "Tone Builder Desktop — native Windows amp-sim scaffold with ASIO / WASAPI low-latency audio"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[features]
default = []
# Enable Steinberg ASIO via cpal. Requires Windows + ASIO SDK (see asio_sdk/README.md)
# and typically LLVM/Clang (LIBCLANG_PATH). Do not commit the proprietary SDK.
asio = ["cpal/asio"]

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
cpal = "0.15"
parking_lot = "0.12"
rtrb = "0.3"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[[bin]]
name = "tone-builder-desktop"
path = "src/main.rs"
